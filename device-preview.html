<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAura Studio — Responsive Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#26314a;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 25px;background:#fff;border-bottom:1px solid #dce2eb;flex-wrap:wrap}header b{font-size:17px}header small{display:block;font-size:11px;color:#8590a2;margin-top:5px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;cursor:pointer;border:1px solid #dce2eb;background:#fff;border-radius:7px;color:#5c6a81;padding:10px 13px;text-decoration:none;font-size:12px}button[aria-pressed=true]{background:#c9232e;color:white;border-color:#c9232e}.stage{padding:25px 12px 35px;overflow-x:auto;text-align:center}.frame-shell{display:inline-block;max-width:none;border:7px solid #26314a;border-radius:29px;box-shadow:0 18px 50px #34425d18;background:#fff;overflow:hidden;transition:width .2s;width:404px;height:844px}iframe{width:100%;height:100%;display:block;border:0;background:white}.caption{margin:15px 0 0;font-size:11px;color:#8995a8}@media(max-width:600px){header{padding:16px}.stage{padding:14px 0}.frame-shell{width:100%!important;height:calc(100dvh - 180px);border:0;border-radius:0}.caption{display:none}.buttons button{font-size:11px;padding:9px}}</style></head><body><header><div><b>WebAura Studio / Responsive preview</b><small>Explore the same website at different screen widths.</small></div><div class="buttons"><button data-width="334" aria-pressed="false">320 px</button><button data-width="404" aria-pressed="true">390 px</button><button data-width="444" aria-pressed="false">430 px</button><button data-width="782" aria-pressed="false">Tablet</button><button data-width="1214" aria-pressed="false">Desktop</button><a href="index.html" target="_blank" rel="noopener">Open full site ↗</a></div></header><main class="stage"><div class="frame-shell" id="device"><iframe src="index.html" title="WebAura Studio responsive website"></iframe></div><p class="caption">Browser-width preview. Real device behavior can vary.</p></main><script>document.querySelectorAll('button[data-width]').forEach(b=>b.onclick=()=>{document.getElementById('device').style.width=b.dataset.width+'px';document.querySelectorAll('button[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});</script></body></html>
